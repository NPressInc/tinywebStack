{% extends "base.html" %}
{% block title %}Redeem invite · TinyWeb{% endblock %}
{% block nav %}
<nav class="tw-nav"><a href="{{ url('/') }}">← Home</a></nav>
{% endblock %}
{% block content %}
<h1>Redeem an invite</h1>
<p class="hint">Paste the invite from the other household to link your homes for chat.</p>
{% if message %}
<div class="card"><p>{{ message }}</p></div>
{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Invite token</label>
  <input name="token" value="{{ token }}" required>
  <button type="submit">Link households</button>
</form>
{% endblock %}
