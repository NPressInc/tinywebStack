<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redeem household invite</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; font-family: monospace; }
  </style>
</head>
<body>
  <p><a href="/">← Back</a></p>
  <h1>Redeem invite</h1>
  {% if message %}
  <p><strong>{{ message }}</strong></p>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Paste invite token from the other household</label>
    <textarea name="token" rows="5">{{ token }}</textarea>
    <button type="submit">Redeem</button>
  </form>
</body>
</html>
