<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Family dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    a { color: #0366d6; }
  </style>
</head>
<body>
  <h1>Family dashboard</h1>
  <p>Signed in as <strong>{{ user }}</strong> (parents group).</p>
  {% if location_url %}
  <p>Location (parents only): <a href="{{ location_url }}">{{ location_url }}</a></p>
  {% endif %}
  <h2>Kids</h2>
  {% if kids %}
  <ul>
    {% for kid in kids %}
    <li><a href="/kid/{{ kid }}">{{ kid }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No users in the <code>kids</code> group yet.</p>
  {% endif %}
</body>
</html>
