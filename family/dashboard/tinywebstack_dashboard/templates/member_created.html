<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account created</title>
  {% include "base_styles.html" %}
</head>
<body>
  <nav><a href="{{ url('/members') }}">← Family members</a></nav>
  <h1>{{ username }} is ready</h1>
  <div class="card">
    <p class="hint">Give them this password once. You can reset it anytime from their profile.</p>
    <label>Password</label>
    <textarea rows="2" readonly>{{ password }}</textarea>
  </div>
  {% if role == 'kid' %}
  <p><a href="{{ url('/members/' ~ username ~ '/location') }}">Set up location on their phone</a></p>
  <p><a href="{{ url('/kid/@' ~ username ~ ':' ~ server_name) }}">Set chat contacts &amp; quiet hours</a></p>
  {% endif %}
  <p><a href="{{ url('/members/' ~ username) }}">Manage {{ username }}</a></p>
</body>
</html>
