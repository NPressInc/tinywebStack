{% extends "base.html" %}
{% block title %}Chat rules · TinyWeb{% endblock %}
{% block nav %}
<nav class="tw-nav"><a href="{{ url('/') }}">← Home</a></nav>
{% endblock %}
{% block content %}
<h1>{{ kid_mxid }}</h1>
<p class="hint">Who this child may message, and when messages are paused (quiet hours).</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Allowed chat partners (one full address per line)</label>
  <textarea name="allowlist_mxids" rows="6">{{ allowlist_mxids }}</textarea>
  <label>Trusted other homes (whole domain names)</label>
  <textarea name="allowlist_domains" rows="3">{{ allowlist_domains }}</textarea>
  <h2>Quiet hours</h2>
  <label>Start (HH:MM)</label>
  <input name="qh_start" value="{{ qh_start }}" placeholder="21:00">
  <label>End (HH:MM)</label>
  <input name="qh_end" value="{{ qh_end }}" placeholder="07:00">
  <label>Timezone</label>
  <input name="qh_timezone" value="{{ qh_timezone }}" placeholder="America/Los_Angeles">
  <button type="submit">Save</button>
</form>
{% endblock %}
