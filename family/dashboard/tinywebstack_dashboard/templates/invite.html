<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create household invite</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; font-family: monospace; }
  </style>
</head>
<body>
  <p><a href="{{ url('/') }}">← Back</a></p>
  <h1>Invite another household</h1>
  <form method="post" action="{{ url('/invite/create') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Generate one-time invite</button>
  </form>
  {% if token %}
  <h2>Share with the other parent</h2>
  <p>Invite URL (expires in about 1 hour):</p>
  <textarea rows="3" readonly>{{ invite_url }}</textarea>
  <p>Or paste the token on the other node under <strong>Redeem invite</strong>.</p>
  <textarea rows="4" readonly>{{ token }}</textarea>
  {% endif %}
</body>
</html>
