[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywebstack-calendar"
version = "0.1.0"
description = "Nextcloud Calendar setup and verification for tinywebStack"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
verify = ["caldav>=1.3.9", "vobject>=0.9.6"]
test = ["pytest>=7.0", "caldav>=1.3.9", "vobject>=0.9.6"]

# Console entry points (S5.4). The shell scripts keep calling
# `python -m tinywebstack_calendar.setup|verify` (byte-for-byte lab flow);
# these wrappers exist so the CLI is usable straight from the installed
# wheel, e.g. `tinywebstack-calendar-setup --help`.
[project.scripts]
tinywebstack-calendar-setup = "tinywebstack_calendar.setup:main"
tinywebstack-calendar-verify = "tinywebstack_calendar.verify:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinywebstack_calendar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
