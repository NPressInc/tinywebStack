[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywebstack-permissions"
version = "0.1.0"
description = "Declarative SQLite role→permission store for tinywebStack family layer (F1.3)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "fastapi>=0.100", "httpx>=0.24"]

[project.scripts]
tws-permissions = "tinywebstack_permissions.seed_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinywebstack_permissions*"]

[tool.setuptools.package-data]
tinywebstack_permissions = ["roles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
